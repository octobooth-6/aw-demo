name: Daily Activity Report

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "daily-report" \
            --repo "${{ github.repository }}" \
            --color "0075ca" \
            --description "Automated daily activity report" 2>/dev/null || true

      - name: Generate and post report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - << 'EOF'
          import subprocess, json, os, sys
          from datetime import datetime, timezone, timedelta

          repo = os.environ["REPO"]
          run_url = os.environ["RUN_URL"]
          now = datetime.now(timezone.utc)
          since = (now - timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ")
          today = now.strftime("%Y-%m-%d")

          def gh_api(path):
              r = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"Warning: {path} → {r.stderr.strip()}", file=sys.stderr)
                  return []
              return json.loads(r.stdout) if r.stdout.strip() else []

          def section(items, fmt, empty):
              return "\n".join(fmt(i) for i in items) if items else f"_{empty}_"

          def fmt_pr(p):
              return f"- [#{p['number']}]({p['html_url']}) {p['title']} (@{p['user']['login']})"

          def fmt_issue(i):
              return f"- [#{i['number']}]({i['html_url']}) {i['title']} (@{i['user']['login']})"

          def fmt_commit(c):
              sha = c['sha'][:7]
              msg = c['commit']['message'].split('\n')[0]
              author = (c.get('author') or {}).get('login') or c['commit']['author']['name']
              return f"- [`{sha}`]({c['html_url']}) {msg} — @{author}"

          commits    = gh_api(f"repos/{repo}/commits?since={since}&per_page=100")
          open_prs   = gh_api(f"repos/{repo}/pulls?state=open&sort=created&direction=desc&per_page=100")
          closed_prs = gh_api(f"repos/{repo}/pulls?state=closed&sort=updated&direction=desc&per_page=100")
          all_issues = gh_api(f"repos/{repo}/issues?state=all&sort=updated&direction=desc&per_page=100&since={since}")

          prs_opened = [p for p in open_prs + closed_prs if p['created_at'] >= since]
          prs_merged = [p for p in closed_prs if p.get('merged_at') and p['merged_at'] >= since]
          prs_closed = [p for p in closed_prs if not p.get('merged_at') and p['closed_at'] >= since]

          real_issues    = [i for i in all_issues if 'pull_request' not in i]
          issues_opened  = [i for i in real_issues if i['created_at'] >= since]
          issues_closed  = [i for i in real_issues if i['state'] == 'closed' and (i.get('closed_at') or '') >= since]

          body = f"""## 📊 Daily Activity Report — {today}

> Activity in the last 24 hours for `{repo}`

---

### 🔀 Pull Requests

**Opened**
{section(prs_opened, fmt_pr, "No PRs opened")}

**Merged**
{section(prs_merged, fmt_pr, "None")}

**Closed (unmerged)**
{section(prs_closed, fmt_pr, "None")}

---

### 🐛 Issues

**Opened**
{section(issues_opened, fmt_issue, "No issues opened")}

**Closed**
{section(issues_closed, fmt_issue, "None")}

---

### 📝 Commits

{section(commits, fmt_commit, "No commits in the last 24 hours")}

---
_Generated by the [Daily Activity Report workflow]({run_url})_"""

          with open("/tmp/report.md", "w") as f:
              f.write(body)

          result = subprocess.run([
              "gh", "issue", "create",
              "--repo", repo,
              "--title", f"📊 Daily Activity Report — {today}",
              "--body-file", "/tmp/report.md",
              "--label", "daily-report",
          ], capture_output=True, text=True)

          if result.returncode == 0:
              print(f"✅ Issue created: {result.stdout.strip()}")
          else:
              print(f"❌ {result.stderr}", file=sys.stderr)
              sys.exit(1)
          EOF
